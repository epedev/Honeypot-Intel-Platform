<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#0d1117"/>

  <!-- decoy box -->
  <rect x="40" y="60" width="330" height="360" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="205" y="95" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">decoy (Azure VM)</text>
  <text x="205" y="116" fill="#8b949e" font-size="12" text-anchor="middle">public-facing, exposed</text>

  <rect x="65" y="140" width="280" height="90" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="80" y="162" fill="#e6edf3" font-size="13" font-weight="600">Flask decoy app</text>
  <text x="80" y="182" fill="#8b949e" font-size="11">bait routes: /admin, /.env,</text>
  <text x="80" y="198" fill="#8b949e" font-size="11">/.git/config, IDOR-shaped API</text>
  <text x="80" y="217" fill="#8b949e" font-size="11">logs every hit as flat JSON</text>

  <rect x="65" y="248" width="280" height="60" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="80" y="270" fill="#e6edf3" font-size="13" font-weight="600">decoy.log</text>
  <text x="80" y="290" fill="#8b949e" font-size="11">RotatingFileHandler — passive,</text>
  <text x="80" y="304" fill="#8b949e" font-size="11" opacity="0">spacer</text>

  <rect x="65" y="326" width="280" height="70" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="80" y="349" fill="#e6edf3" font-size="13" font-weight="600">Headscale (mesh VPN)</text>
  <text x="80" y="369" fill="#8b949e" font-size="11">100.64.x mesh addressing</text>
  <text x="80" y="384" fill="#8b949e" font-size="11">never initiates outbound to homelab</text>

  <!-- homelab box -->
  <rect x="530" y="60" width="330" height="360" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="695" y="95" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">homelab (local box)</text>
  <text x="695" y="116" fill="#8b949e" font-size="12" text-anchor="middle">initiates the pull, holds the SSH key</text>

  <rect x="555" y="140" width="280" height="130" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="570" y="162" fill="#e6edf3" font-size="13" font-weight="600">ingest.py (cron, every 5 min)</text>
  <text x="570" y="184" fill="#8b949e" font-size="11">├─ pull_log()   rsync FROM decoy</text>
  <text x="570" y="202" fill="#8b949e" font-size="11">├─ normalize_event()</text>
  <text x="570" y="220" fill="#8b949e" font-size="11">├─ categorize_route()</text>
  <text x="570" y="238" fill="#8b949e" font-size="11">└─ insert_events()</text>

  <rect x="555" y="284" width="280" height="60" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="570" y="306" fill="#e6edf3" font-size="13" font-weight="600">Postgres 16 (Docker)</text>
  <text x="570" y="326" fill="#8b949e" font-size="11">honeypot_events table</text>

  <rect x="555" y="358" width="280" height="38" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="570" y="382" fill="#e6edf3" font-size="13" font-weight="600">Grafana — 4 dashboard panels</text>

  <!-- arrow: decoy -> homelab, labeled as PULL initiated by homelab -->
  <line x1="370" y1="185" x2="530" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="160" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">SSH + rsync</text>
  <text x="450" y="205" fill="#58a6ff" font-size="10.5" text-anchor="middle">homelab PULLS decoy.log</text>
  <text x="450" y="220" fill="#58a6ff" font-size="10.5" text-anchor="middle">(decoy never pushes)</text>

  <text x="450" y="450" fill="#6e7681" font-size="11" text-anchor="middle">
    Deliberate direction: decoy holds no credentials for reaching back into the home network.
  </text>
</svg>
